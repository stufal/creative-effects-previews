<!--
@name Liquid Metal
@category Material & Transition
@tags webgl, shader, chrome, liquid metal, mercury, button, ring, badge, cursor reactive
@deps none (raw WebGL 1)
@support All browsers with WebGL; falls back to a static metallic gradient
@description Real-time liquid chrome flowing through button rings, icon buttons and badges. Reflections slowly ripple, a soft halo orbits the element and the metal bends toward the cursor as it approaches.
@usage Add class .metal to an element and give it a .metal-inner child for ring mode (the ring thickness is the inner inset, --ring). Add .metal-fill instead for a solid metal badge. One small WebGL canvas is created per element, so keep it to a handful per page.
@source Concept from libraries.dev "Liquid Metal", recreated from scratch
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  const q = new URLSearchParams(location.search); if (!q.has('preview')) return
  document.documentElement.classList.add('fx-preview')
  const RATE = 0.5, hoverMode = q.get('preview') === 'hover'
  const realNow = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window)
  let virt = 0, last = realNow(), paused = false, queue = [], ids = 0
  const now = () => { const n = realNow(); if (!paused) virt += (n - last) * RATE; last = n; return virt }
  performance.now = now
  window.requestAnimationFrame = cb => { queue.push([++ids, cb]); return ids }
  window.cancelAnimationFrame = id => { queue = queue.filter(e => e[0] !== id) }
  const slowed = new WeakSet(), heldByUs = new Set()
  const syncAnimations = () => { if (!document.getAnimations) return
    for (const a of document.getAnimations()) {
      if (!slowed.has(a)) { a.playbackRate *= RATE; slowed.add(a) }
      if (paused && a.playState === 'running') { a.pause(); heldByUs.add(a) }
    }
    if (!paused) { for (const a of heldByUs) if (a.playState === 'paused') a.play(); heldByUs.clear() }
  }
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, last2 = null, prev = 0, syncAt = 0
  function ghost(t, dt) {
    const max = document.documentElement.scrollHeight - innerHeight
    if (max > 20) { y += dir * max * dt / 16000; if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
    const s = t / 1000, x = innerWidth * (.5 + .3 * Math.sin(s * 1.1)), py = innerHeight * (.5 + .26 * Math.sin(s * 1.7)), o = { bubbles: true, clientX: x, clientY: py }
    const el = document.elementFromPoint(x, py)
    if (el !== last2) {
      const a = chain(last2), b = chain(el)
      a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
      if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
      b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
      last2 = el
    }
    ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
  }
  let ghostOn = false; setTimeout(() => { ghostOn = true }, 500)
  function frame() {
    const t = now(), dt = t - prev; prev = t
    if (!paused) {
      const run = queue; queue = []
      for (const [, cb] of run) { try { cb(t) } catch (e) { setTimeout(() => { throw e }) } }
      if (ghostOn && !real && document.body) ghost(t, dt)
    }
    const r = realNow(); if (r > syncAt) { syncAnimations(); syncAt = r + 150 }
    realRaf(frame)
  }
  realRaf(frame)
  const setPaused = v => { paused = v; syncAnimations() }
  let hovered = false
  addEventListener('message', e => { const c = e.data && e.data.creativeFx
    if (c === 'play') { hovered = true; setPaused(false) } else if (c === 'pause') { hovered = false; setPaused(true) } })
  // Thumbnails: show a meaningful still frame (scroll demos part-way down), then wait for hover
  if (hoverMode) setTimeout(() => {
    const max = document.documentElement.scrollHeight - innerHeight
    if (hovered) return
    if (max > 20 && !real) { y = max * .35; scrollTo(0, y) }
    setPaused(true)
  }, 1400)
})()</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Metal</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #0c0c0f; color: #ececf1; font-family: system-ui, sans-serif; display: grid; place-content: center; justify-items: center; gap: 36px; padding: 20px; }
  .composer { width: min(520px, 86vw); height: 112px; border-radius: 22px; }
  .composer .metal-inner { padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between; font-size: 14px; }
  .composer .ph { opacity: .45; }
  .composer .row { display: flex; justify-content: space-between; align-items: center; }
  .chips { display: flex; gap: 6px; } .chip { font-size: 12px; padding: 5px 10px; border-radius: 999px; background: rgb(255 255 255 / .07); opacity: .8; }
  .send { width: 44px; height: 44px; border-radius: 50%; --ring: 3px; cursor: pointer; }
  .send .metal-inner { display: grid; place-items: center; font-size: 18px; }
  .row-demo { display: flex; gap: 22px; align-items: center; }
  .badge { padding: 9px 18px; border-radius: 999px; font: 700 13px system-ui; letter-spacing: .08em; text-transform: uppercase; color: #1a1b1f; text-shadow: 0 1px 0 rgb(255 255 255 / .6); }

  /* === EFFECT === */
  .metal { --ring: 1.5px; --inner: #141418; position: relative; isolation: isolate; }
  .metal > canvas.metal-canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; border-radius: inherit; z-index: -1;
    background: linear-gradient(160deg, #f4f4f6, #6b6e76 40%, #e6e7ea 55%, #3a3c42); /* fallback */
  }
  .metal-inner { position: absolute; inset: var(--ring); border-radius: calc(var(--r, 22px) - var(--ring)); background: var(--inner); }
  .send .metal-inner { border-radius: 50%; }
  .metal::after {            /* soft orbiting halo */
    content: ""; position: absolute; inset: -10px; z-index: -2; border-radius: inherit; pointer-events: none;
    background: conic-gradient(from var(--halo), transparent 0 65%, rgb(255 255 255 / .35), transparent 90%);
    filter: blur(14px); animation: metal-halo 7s linear infinite;
  }
  @property --halo { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes metal-halo { to { --halo: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .metal::after { animation: none; } }
</style>
</head>
<body>
  <div class="metal composer" style="--r:22px">
    <div class="metal-inner">
      <span class="ph">Build anything…</span>
      <div class="row"><div class="chips"><span class="chip">+</span><span class="chip">Agent ▾</span><span class="chip">Auto ▾</span></div>
        <div class="metal send"><div class="metal-inner">↑</div></div></div>
    </div>
  </div>
  <div class="row-demo">
    <span class="metal metal-fill badge">Pro</span>
    <div class="metal send" style="width:56px;height:56px;--ring:4px"><div class="metal-inner">✦</div></div>
  </div>
<script>
  const FS = `precision highp float;
    uniform vec2 r; uniform float t; uniform vec2 m; uniform float mi;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i = floor(p), f = fract(p), u = f*f*(3.-2.*f);
      return mix(mix(h(i), h(i+vec2(1,0)), u.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), u.x), u.y); }
    float fbm(vec2 p){ float v = 0., a = .5; for (int i = 0; i < 4; i++){ v += a*n(p); p *= 2.03; a *= .5; } return v; }
    void main(){
      vec2 p = (gl_FragCoord.xy - .5*r) / r.y * .45, mm = m * .45;   // .45 = reflection scale (lower = broader)
      vec2 d = p - mm; float pull = exp(-dot(d, d) * 14.) * mi;       // cursor bends the metal
      p -= d * pull * .5;
      float warp = fbm(p * 1.3 + vec2(t * .08, -t * .06));
      float v = p.y * 1.6 + p.x * .35 + warp * 1.1 + sin(p.x * 2. + t * .4) * .12;
      float band = .5 + .5 * sin(v * 6.2831 * .55);                    // broad environment reflection bands
      vec3 col = mix(vec3(.05, .055, .07), vec3(.95, .96, .97), smoothstep(.2, .8, band));
      col = mix(col, vec3(.5, .52, .56), smoothstep(.3, .7, fbm(p * 2.5 - t * .1)) * .25);
      col += pow(max(0., sin(v * 4.2 - t * .5)), 40.) * .8;             // sharp speculars
      col += pull * .25;
      col *= vec3(.97, .99, 1.04);                                     // cool chrome tint
      gl_FragColor = vec4(col, 1.);
    }`;
  const VS = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0., 1.); }';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const items = [];
  let mouse = { x: -1e4, y: -1e4 };
  addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; });

  document.querySelectorAll('.metal').forEach(el => {
    const cv = document.createElement('canvas'); cv.className = 'metal-canvas'; el.prepend(cv);
    const gl = cv.getContext('webgl', { premultipliedAlpha: false }); if (!gl) return;
    const sh = (ty, src) => { const s = gl.createShader(ty); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
    gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer()); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    const U = k => gl.getUniformLocation(pr, k);
    items.push({ el, cv, gl, uR: U('r'), uT: U('t'), uM: U('m'), uMi: U('mi'), mi: 0, seed: Math.random() * 100 });
  });
  const resize = () => items.forEach(it => {
    const d = Math.min(devicePixelRatio, 2), r = it.el.getBoundingClientRect();
    it.cv.width = Math.max(1, r.width * d); it.cv.height = Math.max(1, r.height * d);
    it.gl.viewport(0, 0, it.cv.width, it.cv.height);
  });
  addEventListener('resize', resize); resize();
  (function frame(now) {
    for (const it of items) {
      const r = it.el.getBoundingClientRect(), { gl } = it;
      const mx = (mouse.x - (r.left + r.width / 2)) / r.height, my = -(mouse.y - (r.top + r.height / 2)) / r.height;
      const near = Math.hypot(mx * r.height, my * r.height) < Math.max(r.width, r.height) * .8 + 60 ? 1 : 0;
      it.mi += (near - it.mi) * .08;
      gl.uniform2f(it.uR, it.cv.width, it.cv.height); gl.uniform1f(it.uT, reduce ? it.seed : now / 1000 + it.seed);
      gl.uniform2f(it.uM, mx, my); gl.uniform1f(it.uMi, it.mi);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    requestAnimationFrame(frame);
  })(0);
</script>
</body>
</html>
