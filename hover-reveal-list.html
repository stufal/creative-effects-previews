<!--
@name Hover Image Reveal List
@category Cursor & Hover
@tags list, hover, preview, follow cursor, velocity, rotation, projects index
@deps none
@support Evergreen browsers; touch shows nothing (list stays usable)
@description Hovering a project title in a big typographic list reveals a floating preview image that follows the cursor with inertia and tilts with velocity; other rows dim.
@usage Each .reveal-item gets data-color (or data-img for a real image URL). The preview element is shared.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  const q = new URLSearchParams(location.search); if (!q.has('preview')) return
  document.documentElement.classList.add('fx-preview')
  const RATE = 1, hoverMode = q.get('preview') === 'hover'
  const realNow = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window)
  let virt = 0, last = realNow(), paused = false, queue = [], ids = 0
  const now = () => { const n = realNow(); if (!paused) virt += (n - last) * RATE; last = n; return virt }
  performance.now = now
  window.requestAnimationFrame = cb => { queue.push([++ids, cb]); return ids }
  window.cancelAnimationFrame = id => { queue = queue.filter(e => e[0] !== id) }
  const slowed = new WeakSet(), heldByUs = new Set()
  const syncAnimations = () => { if (!document.getAnimations) return
    for (const a of document.getAnimations()) {
      if (!slowed.has(a)) { a.playbackRate *= RATE; slowed.add(a) }
      if (paused && a.playState === 'running') { a.pause(); heldByUs.add(a) }
    }
    if (!paused) { for (const a of heldByUs) if (a.playState === 'paused') a.play(); heldByUs.clear() }
  }
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, last2 = null, prev = 0, syncAt = 0
  function ghost(t, dt) {
    const max = document.documentElement.scrollHeight - innerHeight
    if (max > 20) { y += dir * max * dt / 8000; if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
    const s = t / 1000, x = innerWidth * (.5 + .3 * Math.sin(s * 1.1)), py = innerHeight * (.5 + .26 * Math.sin(s * 1.7)), o = { bubbles: true, clientX: x, clientY: py }
    const el = document.elementFromPoint(x, py)
    if (el !== last2) {
      const a = chain(last2), b = chain(el)
      a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
      if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
      b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
      last2 = el
    }
    ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
  }
  let ghostOn = false; setTimeout(() => { ghostOn = true }, 500)
  function frame() {
    const t = now(), dt = t - prev; prev = t
    if (!paused) {
      const run = queue; queue = []
      for (const [, cb] of run) { try { cb(t) } catch (e) { setTimeout(() => { throw e }) } }
      if (ghostOn && !real && document.body) ghost(t, dt)
    }
    const r = realNow(); if (r > syncAt) { syncAnimations(); syncAt = r + 150 }
    realRaf(frame)
  }
  realRaf(frame)
  const setPaused = v => { paused = v; syncAnimations() }
  let hovered = false
  addEventListener('message', e => { const c = e.data && e.data.creativeFx
    if (c === 'play') { hovered = true; setPaused(false) } else if (c === 'pause') { hovered = false; setPaused(true) } })
  // Thumbnails: show a meaningful still frame (scroll demos part-way down), then wait for hover
  if (hoverMode) setTimeout(() => {
    const max = document.documentElement.scrollHeight - innerHeight
    if (hovered) return
    if (max > 20 && !real) { y = max * .35; scrollTo(0, y) }
    setPaused(true)
  }, 1400)
})()</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hover Image Reveal List</title>
<style>
  html { height: 100%; } body { margin: 0; min-height: 100%; }
  body { background: #0b0b0d; color: #f1efe9; font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 30px 20px; box-sizing: border-box; }
  ul { list-style: none; margin: 0; padding: 0; width: min(760px, 100%); }
  .reveal-item { display: flex; justify-content: space-between; align-items: baseline; padding: 16px 0; border-top: 1px solid rgba(255,255,255,.12); cursor: pointer; transition: opacity .3s; }
  .reveal-item:last-child { border-bottom: 1px solid rgba(255,255,255,.12); }
  .reveal-item b { font-size: clamp(24px, 5vw, 46px); font-weight: 600; letter-spacing: -.03em; }
  .reveal-item small { font: 12px ui-monospace, monospace; opacity: .5; }

  /* === EFFECT === */
  ul:hover .reveal-item:not(:hover) { opacity: .3; }
  .reveal-preview {
    position: fixed; left: 0; top: 0; width: 240px; aspect-ratio: 4/3; margin: -90px 0 0 -120px;
    border-radius: 12px; pointer-events: none; z-index: 5; background-size: cover; background-position: center;
    opacity: 0; scale: .6; transition: opacity .3s, scale .4s cubic-bezier(.2,.8,.2,1), background .3s;
  }
  .reveal-preview.is-on { opacity: 1; scale: 1; }
</style>
</head>
<body>
  <ul>
    <li class="reveal-item" data-color="linear-gradient(135deg,#ff6b6b,#ffd166)"><b>Solstice</b><small>Branding · 2026</small></li>
    <li class="reveal-item" data-color="linear-gradient(135deg,#4facfe,#00f2fe)"><b>Northwind</b><small>Product · 2025</small></li>
    <li class="reveal-item" data-color="linear-gradient(135deg,#a18cd1,#fbc2eb)"><b>Halcyon</b><small>Web · 2025</small></li>
    <li class="reveal-item" data-color="linear-gradient(135deg,#43e97b,#38f9d7)"><b>Verdant</b><small>Motion · 2024</small></li>
  </ul>
  <div class="reveal-preview" aria-hidden="true"></div>
<script>
  const pv = document.querySelector('.reveal-preview');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let x = 0, y = 0, tx = 0, ty = 0;
  document.querySelectorAll('.reveal-item').forEach(item => {
    item.addEventListener('pointerenter', e => {
      if (!x) { x = tx = e.clientX; y = ty = e.clientY; }
      pv.style.background = item.dataset.img ? `center/cover url(${item.dataset.img})` : item.dataset.color;
      pv.classList.add('is-on');
    });
    item.addEventListener('pointerleave', () => pv.classList.remove('is-on'));
  });
  addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; });
  (function loop() {
    const vx = (tx - x) * (reduce ? 1 : .12);
    x += vx; y += (ty - y) * (reduce ? 1 : .12);
    pv.style.transform = `translate3d(${x}px,${y}px,0) rotate(${reduce ? 0 : Math.max(-15, Math.min(15, vx * .6))}deg)`;
    requestAnimationFrame(loop);
  })();
</script>
</body>
</html>
