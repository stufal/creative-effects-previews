<!--
@name Shared Element Morph (View Transitions)
@category Material & Transition
@tags view transitions api, shared element, morph, expand, gallery, page transition
@deps none
@support View Transitions in Chrome/Edge 111+, Safari 18+, Firefox 144+; instant swap elsewhere
@description Clicking a thumbnail morphs it seamlessly into a full detail view — position, size and radius interpolate natively via document.startViewTransition and view-transition-name. The same API powers cross-page (MPA) transitions.
@usage Give the element a unique view-transition-name in both states, then wrap your DOM update in document.startViewTransition(). For MPA sites add @view-transition { navigation: auto; }.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  const q = new URLSearchParams(location.search); if (!q.has('preview')) return
  document.documentElement.classList.add('fx-preview')
  const RATE = 0.5, hoverMode = q.get('preview') === 'hover'
  const realNow = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window)
  let virt = 0, last = realNow(), paused = false, queue = [], ids = 0
  const now = () => { const n = realNow(); if (!paused) virt += (n - last) * RATE; last = n; return virt }
  performance.now = now
  window.requestAnimationFrame = cb => { queue.push([++ids, cb]); return ids }
  window.cancelAnimationFrame = id => { queue = queue.filter(e => e[0] !== id) }
  const slowed = new WeakSet(), heldByUs = new Set()
  const syncAnimations = () => { if (!document.getAnimations) return
    for (const a of document.getAnimations()) {
      if (!slowed.has(a)) { a.playbackRate *= RATE; slowed.add(a) }
      if (paused && a.playState === 'running') { a.pause(); heldByUs.add(a) }
    }
    if (!paused) { for (const a of heldByUs) if (a.playState === 'paused') a.play(); heldByUs.clear() }
  }
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, last2 = null, prev = 0, syncAt = 0
  function ghost(t, dt) {
    const max = document.documentElement.scrollHeight - innerHeight
    if (max > 20) { y += dir * max * dt / 16000; if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
    const s = t / 1000, x = innerWidth * (.5 + .3 * Math.sin(s * 1.1)), py = innerHeight * (.5 + .26 * Math.sin(s * 1.7)), o = { bubbles: true, clientX: x, clientY: py }
    const el = document.elementFromPoint(x, py)
    if (el !== last2) {
      const a = chain(last2), b = chain(el)
      a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
      if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
      b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
      last2 = el
    }
    ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
  }
  let ghostOn = false; setTimeout(() => { ghostOn = true }, 500)
  function frame() {
    const t = now(), dt = t - prev; prev = t
    if (!paused) {
      const run = queue; queue = []
      for (const [, cb] of run) { try { cb(t) } catch (e) { setTimeout(() => { throw e }) } }
      if (ghostOn && !real && document.body) ghost(t, dt)
    }
    const r = realNow(); if (r > syncAt) { syncAnimations(); syncAt = r + 150 }
    realRaf(frame)
  }
  realRaf(frame)
  const setPaused = v => { paused = v; syncAnimations() }
  let hovered = false
  addEventListener('message', e => { const c = e.data && e.data.creativeFx
    if (c === 'play') { hovered = true; setPaused(false) } else if (c === 'pause') { hovered = false; setPaused(true) } })
  // Thumbnails: show a meaningful still frame (scroll demos part-way down), then wait for hover
  if (hoverMode) setTimeout(() => {
    const max = document.documentElement.scrollHeight - innerHeight
    if (hovered) return
    if (max > 20 && !real) { y = max * .35; scrollTo(0, y) }
    setPaused(true)
  }, 1400)
})()</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shared Element Morph</title>
<style>
  html { height: 100%; } body { margin: 0; min-height: 100%; }
  body { background: #f4f2ee; color: #141414; font-family: system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; max-width: 820px; margin: auto; }
  .thumb { aspect-ratio: 1; border: 0; border-radius: 18px; cursor: pointer; background: var(--bg); }
  .detail { position: fixed; inset: 0; display: grid; grid-template-columns: 1.2fr 1fr; gap: 28px; padding: 28px; background: #f4f2ee; box-sizing: border-box; }
  .detail[hidden] { display: none; }
  .detail .hero { border-radius: 28px; background: var(--bg); }
  .detail h2 { font-size: clamp(32px, 6vw, 64px); margin: 0 0 12px; letter-spacing: -.04em; }
  .detail button { font: 600 14px system-ui; padding: 10px 18px; border-radius: 999px; border: 1px solid #141414; background: none; cursor: pointer; }
  @media (max-width: 600px) { .detail { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } }

  /* === EFFECT === */
  ::view-transition-group(*) { animation-duration: .55s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
  ::view-transition-old(hero), ::view-transition-new(hero) { height: 100%; object-fit: cover; }
  .detail .info { animation: fade-up .5s .2s both; }
  @keyframes fade-up { from { opacity: 0; transform: translateY(20px); } }
</style>
</head>
<body>
  <div class="grid"></div>
  <section class="detail" hidden>
    <div class="hero"></div>
    <div class="info"><h2></h2><p>The thumbnail morphed into this hero. Close to watch it fly back to its exact place in the grid.</p><button>← Back</button></div>
  </section>
<script>
  const items = [['Ember', '#ff7a59'], ['Lagoon', '#3fb8af'], ['Iris', '#8c7bff'], ['Citrine', '#ffd23f'], ['Moss', '#7bb661'], ['Rose', '#ff8fb1']];
  const grid = document.querySelector('.grid'), detail = document.querySelector('.detail'), hero = detail.querySelector('.hero');
  items.forEach(([name, c]) => {
    const b = document.createElement('button'); b.className = 'thumb'; b.style.setProperty('--bg', c); b.setAttribute('aria-label', name);
    b.onclick = () => open(b, name, c); grid.append(b);
  });
  let current = null;
  // The element named "hero" in the OLD state morphs into the element named "hero" in the NEW state.
  const morph = (from, to, update) => {
    from.style.viewTransitionName = 'hero';
    const swap = () => { from.style.viewTransitionName = ''; to.style.viewTransitionName = 'hero'; update(); };
    if (!document.startViewTransition || matchMedia('(prefers-reduced-motion: reduce)').matches) return swap();
    document.startViewTransition(swap);
  };
  function open(thumb, name, c) {
    if (current) current.style.viewTransitionName = ''; // names must be unique per snapshot
    current = thumb;
    morph(thumb, hero, () => { hero.style.setProperty('--bg', c); detail.querySelector('h2').textContent = name; detail.hidden = false; });
  }
  detail.querySelector('button').onclick = () => morph(hero, current, () => { detail.hidden = true; current.focus(); });
</script>
</body>
</html>
