<!--
@name Text Scramble / Decode
@category Text
@tags scramble, decode, glitch, hacker, monospace, hover, rotating headline
@deps none
@support Evergreen browsers
@description Text resolves out of random glyphs character by character, like a decoding terminal. Used for rotating headlines and on hover for nav links.
@usage new Scramble(el).setText('New text') returns a promise. Add data-scramble-hover to links to scramble their own label on hover. CHARS controls the glyph set.
@source Classic pattern (Justin Windle), modernised
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Text Scramble / Decode</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #070709; color: #e6ffe9; font-family: ui-monospace, "SF Mono", Menlo, monospace; display: grid; place-content: center; gap: 40px; text-align: center; padding: 20px; }
  .headline { font-size: clamp(26px, 6vw, 60px); font-weight: 700; min-height: 1.2em; letter-spacing: -.02em; }
  nav { display: flex; gap: 28px; justify-content: center; }
  nav a { color: #9be7a6; text-decoration: none; font-size: 15px; text-transform: uppercase; letter-spacing: .1em; }

  /* === EFFECT === */
  .scramble-glyph { color: #47ff7a; opacity: .7; }
</style>
</head>
<body>
  <div class="headline" aria-live="polite"></div>
  <nav><a href="#" data-scramble-hover>Projects</a><a href="#" data-scramble-hover>Studio</a><a href="#" data-scramble-hover>Contact</a></nav>
<script>
  class Scramble {
    static CHARS = '!<>-_\\/[]{}—=+*^?#ABCDEFX01';
    constructor(el) { this.el = el; this.raf = 0; }
    setText(next) {
      const prev = this.el.innerText, len = Math.max(prev.length, next.length);
      this.queue = Array.from({ length: len }, (_, i) => {
        const start = Math.floor(Math.random() * 30), end = start + Math.floor(Math.random() * 30);
        return { from: prev[i] || '', to: next[i] || '', start, end, ch: '' };
      });
      cancelAnimationFrame(this.raf); this.frame = 0;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { this.el.textContent = next; return Promise.resolve(); }
      return new Promise(res => (this.resolve = res, this.tick()));
    }
    tick = () => {
      let out = '', done = 0;
      for (const q of this.queue) {
        if (this.frame >= q.end) { done++; out += q.to; }
        else if (this.frame >= q.start) {
          if (!q.ch || Math.random() < .28) q.ch = Scramble.CHARS[Math.floor(Math.random() * Scramble.CHARS.length)];
          out += `<span class="scramble-glyph">${q.ch}</span>`;
        } else out += q.from;
      }
      this.el.innerHTML = out;
      if (done === this.queue.length) this.resolve(); else { this.frame++; this.raf = requestAnimationFrame(this.tick); }
    };
  }

  // Rotating headline
  const phrases = ['Design is how it works.', 'Ship delightful details.', 'Motion with meaning.'];
  const fx = new Scramble(document.querySelector('.headline'));
  let n = 0; const next = () => fx.setText(phrases[n++ % phrases.length]).then(() => setTimeout(next, 1800)); next();

  // Hover scramble on links
  document.querySelectorAll('[data-scramble-hover]').forEach(a => {
    const s = new Scramble(a), label = a.textContent; a.setAttribute('aria-label', label);
    a.addEventListener('pointerenter', () => s.setText(label));
  });
</script>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
