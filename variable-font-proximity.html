<!--
@name Variable Font Proximity
@category Text
@tags variable font, font-weight, proximity, cursor, typography, wght axis
@deps Google Fonts — Inter variable (any variable font works)
@support Evergreen browsers
@description Each letter's weight swells smoothly as the cursor approaches, creating a living typographic wave that follows the pointer across the word.
@usage Add data-proximity to a heading set in a variable font. Configure MIN/MAX weight and RADIUS (px). Works with any axis via font-variation-settings.
@source Inspired by variable-type experiments (e.g. fontsinuse, Codrops)
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Variable Font Proximity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #f6f3ee; color: #161616; font-family: Inter, system-ui, sans-serif; display: grid; place-content: center; text-align: center; padding: 20px; }
  h1 { margin: 0; font-size: clamp(48px, 13vw, 150px); letter-spacing: -.04em; line-height: 1; font-weight: 100; }
  p { opacity: .5; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }

  /* === EFFECT === */
  [data-proximity] .pchar { display: inline-block; font-weight: var(--w, 100); transition: font-weight .12s linear; }
</style>
</head>
<body>
  <h1 data-proximity>Proximity</h1>
  <p>Hover the word</p>
<script>
  const MIN = 100, MAX = 900, RADIUS = 220;
  document.querySelectorAll('[data-proximity]').forEach(el => {
    el.setAttribute('aria-label', el.textContent);
    el.innerHTML = [...el.textContent].map(c => `<span class="pchar" aria-hidden="true">${c === ' ' ? '&nbsp;' : c}</span>`).join('');
    const chars = [...el.children];
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    addEventListener('pointermove', e => chars.forEach(c => {
      const r = c.getBoundingClientRect();
      const d = Math.hypot(e.clientX - (r.left + r.width / 2), e.clientY - (r.top + r.height / 2));
      const t = Math.max(0, 1 - d / RADIUS);
      c.style.setProperty('--w', Math.round(MIN + (MAX - MIN) * t * t * (3 - 2 * t))); // smoothstep
    }));
  });
</script>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
