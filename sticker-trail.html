<!--
@name Sticker Trail
@category Cursor & Hover
@tags cursor, trail, stickers, logos, clients, footer, playful, blur in, web animations api
@deps none
@support Evergreen browsers (Web Animations API); off with reduced motion; tap and drag on touch
@description Move the cursor across the section and stickers pop out along its path every hundred pixels or so. Each one lands slightly tilted, blurs into focus, then shrinks and fades a second later. Great for client logos or a playful footer.
@usage Add .sticker-trail to the section and put your stickers (img or inline SVG) inside a hidden .sticker-pool; they are shuffled and cloned in turn. Tune GAP (pixels between stickers), TILT (max rotation, degrees), SIZE, LIFETIME, IN_MS and OUT_MS in the script, or --sticker-size in CSS.
@source Technique seen on mad.ac/approach (footer logo trail), rebuilt from scratch
@added 2026-10-19
-->
<!doctype html>
<html lang="en">
<head>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  const q = new URLSearchParams(location.search); if (!q.has('preview')) return
  document.documentElement.classList.add('fx-preview')
  // Previews are shown scaled down (cards ≈ 1/5, large preview ≈ 1/3), which makes motion look slower than
  // on a full-size page, so they play slightly faster than real time to feel natural
  const hoverMode = q.get('preview') === 'hover', RATE = hoverMode ? 1.5 : 1.2
  const realNow = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window)
  let virt = 0, last = realNow(), paused = false, queue = [], ids = 0
  const now = () => { const n = realNow(); if (!paused) virt += (n - last) * RATE; last = n; return virt }
  performance.now = now
  window.requestAnimationFrame = cb => { queue.push([++ids, cb]); return ids }
  window.cancelAnimationFrame = id => { queue = queue.filter(e => e[0] !== id) }
  const slowed = new WeakSet(), heldByUs = new Set()
  const syncAnimations = () => { if (!document.getAnimations) return
    for (const a of document.getAnimations()) {
      if (!slowed.has(a)) { a.playbackRate *= RATE; slowed.add(a) }
      if (paused && a.playState === 'running') { a.pause(); heldByUs.add(a) }
    }
    if (!paused) { for (const a of heldByUs) if (a.playState === 'paused') a.play(); heldByUs.clear() }
  }
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, last2 = null, prev = 0, syncAt = 0
  function ghost(t, dt) {
    const max = document.documentElement.scrollHeight - innerHeight
    if (max > 20) { y += dir * max * dt / 6000; if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
    const s = t / 1000, x = innerWidth * (.5 + .3 * Math.sin(s * 1.1)), py = innerHeight * (.5 + .26 * Math.sin(s * 1.7)), o = { bubbles: true, clientX: x, clientY: py }
    const el = document.elementFromPoint(x, py)
    if (el !== last2) {
      const a = chain(last2), b = chain(el)
      a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
      if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
      b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
      last2 = el
    }
    ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
  }
  let ghostOn = false; setTimeout(() => { ghostOn = true }, 500)
  function frame() {
    const t = now(), dt = t - prev; prev = t
    if (!paused) {
      const run = queue; queue = []
      for (const [, cb] of run) { try { cb(t) } catch (e) { setTimeout(() => { throw e }) } }
      if (ghostOn && !real && document.body) ghost(t, dt)
    }
    const r = realNow(); if (r > syncAt) { syncAnimations(); syncAt = r + 150 }
    realRaf(frame)
  }
  realRaf(frame)
  const setPaused = v => { paused = v; syncAnimations() }
  let hovered = false
  addEventListener('message', e => { const c = e.data && e.data.creativeFx
    if (c === 'play') { hovered = true; setPaused(false) } else if (c === 'pause') { hovered = false; setPaused(true) } })
  // Thumbnails: show a meaningful still frame (scroll demos part-way down), then wait for hover
  if (hoverMode) setTimeout(() => {
    const max = document.documentElement.scrollHeight - innerHeight
    if (hovered) return
    if (max > 20 && !real) { y = max * .35; scrollTo(0, y) }
    setPaused(true)
  }, 1400)
})()</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticker Trail</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #121212; color: #f2f1ee; font-family: system-ui, sans-serif; }
  .sticker-trail h2 { margin: 0; font-size: clamp(36px, 8vw, 110px); letter-spacing: -.045em; line-height: .95; font-weight: 650; text-align: center; pointer-events: none; position: relative; z-index: 1; mix-blend-mode: difference; }
  .sticker-trail small { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; opacity: .5; font-size: 13px; }

  /* === EFFECT === */
  .sticker-trail { --sticker-size: 96px; position: relative; overflow: hidden; min-height: 100%; display: grid; place-items: center; touch-action: pan-y; }
  .sticker-pool { display: none; }
  .sticker { position: absolute; width: var(--sticker-size); height: auto; pointer-events: none; translate: -50% -50%; filter: drop-shadow(0 6px 14px rgba(0,0,0,.25)); }
</style>
</head>
<body>
  <footer class="sticker-trail">
    <h2>Let's make<br>something.</h2>
    <small>Move your cursor around</small>
    <div class="sticker-pool" aria-hidden="true">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#ffd23f"/><circle cx="35" cy="42" r="6" fill="#121212"/><circle cx="65" cy="42" r="6" fill="#121212"/><path d="M30 62q20 20 40 0" stroke="#121212" stroke-width="7" fill="none" stroke-linecap="round"/></svg>
      <svg viewBox="0 0 100 100"><path d="M50 2l13 32 35 3-27 22 9 35-30-19-30 19 9-35L2 37l35-3z" fill="#ff5ca8"/></svg>
      <svg viewBox="0 0 120 70"><rect x="2" y="2" width="116" height="66" rx="33" fill="#4c7dff"/><text x="60" y="46" font-family="system-ui" font-size="30" font-weight="800" fill="#fff" text-anchor="middle">WOW</text></svg>
      <svg viewBox="0 0 100 100"><path d="M50 90S8 62 8 34a21 21 0 0 1 42-6 21 21 0 0 1 42 6c0 28-42 56-42 56z" fill="#ff4d3d"/></svg>
      <svg viewBox="0 0 100 100"><rect x="6" y="6" width="88" height="88" rx="20" fill="#c8f560"/><path d="M28 52l15 15 30-34" stroke="#121212" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <svg viewBox="0 0 100 100"><path d="M50 4l10 28 30-6-20 22 20 22-30-6-10 28-10-28-30 6 20-22-20-22 30 6z" fill="#8a5cff"/></svg>
      <svg viewBox="0 0 120 80"><ellipse cx="60" cy="40" rx="57" ry="37" fill="#f2f1ee"/><text x="60" y="50" font-family="system-ui" font-size="28" font-weight="800" fill="#121212" text-anchor="middle">hi!</text></svg>
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#1fd1a5"/><path d="M50 18v64M18 50h64" stroke="#fff" stroke-width="12" stroke-linecap="round"/></svg>
    </div>
  </footer>
<script>
  // === EFFECT JS ===
  const GAP = 100, TILT = 50, SIZE = 96, LIFETIME = 1000, IN_MS = 150, OUT_MS = 300;
  document.querySelectorAll('.sticker-trail').forEach(zone => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    zone.style.setProperty('--sticker-size', SIZE + 'px');
    const pool = [...zone.querySelector('.sticker-pool').children].sort(() => Math.random() - .5);
    let next = 0, last = null;
    const drop = (x, y) => {
      const s = pool[next++ % pool.length].cloneNode(true); s.classList.add('sticker');
      s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.rotate = (Math.random() - .5) * TILT + 'deg';
      zone.append(s);
      s.animate({ opacity: [0, 1], transform: ['scale(1.5)', 'scale(1)'], filter: ['blur(10px)', 'blur(0)'] }, { duration: IN_MS, easing: 'ease' });
      setTimeout(() => s.animate({ opacity: [1, 0], transform: ['scale(1)', 'scale(.5)'], filter: ['blur(0)', 'blur(2px)'] }, { duration: OUT_MS, easing: 'ease', fill: 'forwards' })
        .finished.then(() => s.remove()), LIFETIME);
    };
    const move = e => {
      const r = zone.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      if (!last || Math.hypot(x - last.x, y - last.y) > GAP) { last = { x, y }; drop(x, y); }
    };
    // listen only while the section is on screen
    new IntersectionObserver(([en]) => {
      if (en.isIntersecting) { zone.addEventListener('pointermove', move); zone.addEventListener('pointerdown', move); }
      else { zone.removeEventListener('pointermove', move); zone.removeEventListener('pointerdown', move); last = null; }
    }).observe(zone);
    zone.addEventListener('pointerleave', () => { last = null; });
  });
</script>
</body>
</html>
