<!--
@name Spotlight Border Cards
@category Cursor & Hover
@tags spotlight, border glow, radial-gradient, bento, linear-style, vercel-style
@deps none
@support Evergreen browsers
@description A soft light follows the pointer across a grid of cards, illuminating their 1px borders and inner surface — neighbouring cards catch the edge of the glow. The signature Linear / Vercel feature-grid look.
@usage Wrap cards in .spotlight-grid; each .spot-card needs an inner .spot-inner. Glow colour and size are CSS variables on the grid.
@source Popularised by linear.app
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  const q = new URLSearchParams(window.__fxPreview || location.search); if (!q.has('preview')) return
  document.documentElement.classList.add('fx-preview')
  // Previews are shown scaled down (cards ≈ 1/5, large preview ≈ 1/3), which makes motion look slower than
  // on a full-size page, so they play slightly faster than real time to feel natural
  const hoverMode = q.get('preview') === 'hover', RATE = hoverMode ? 1.5 : 1.2
  const realNow = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window)
  let virt = 0, last = realNow(), paused = false, queue = [], ids = 0
  const now = () => { const n = realNow(); if (!paused) virt += (n - last) * RATE; last = n; return virt }
  performance.now = now
  window.requestAnimationFrame = cb => { queue.push([++ids, cb]); return ids }
  window.cancelAnimationFrame = id => { queue = queue.filter(e => e[0] !== id) }
  const slowed = new WeakSet(), heldByUs = new Set()
  const syncAnimations = () => { if (!document.getAnimations) return
    for (const a of document.getAnimations()) {
      if (!slowed.has(a)) { a.playbackRate *= RATE; slowed.add(a) }
      if (paused && a.playState === 'running') { a.pause(); heldByUs.add(a) }
    }
    if (!paused) { for (const a of heldByUs) if (a.playState === 'paused') a.play(); heldByUs.clear() }
  }
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, last2 = null, prev = 0, syncAt = 0
  function ghost(t, dt) {
    const max = document.documentElement.scrollHeight - innerHeight
    if (max > 20) { y += dir * max * dt / 6000; if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
    const s = t / 1000, x = innerWidth * (.5 + .3 * Math.sin(s * 1.1)), py = innerHeight * (.5 + .26 * Math.sin(s * 1.7)), o = { bubbles: true, clientX: x, clientY: py }
    const el = document.elementFromPoint(x, py)
    if (el !== last2) {
      const a = chain(last2), b = chain(el)
      a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
      if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
      b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
      last2 = el
    }
    ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
  }
  let ghostOn = false; setTimeout(() => { ghostOn = true }, 500)
  function frame() {
    const t = now(), dt = t - prev; prev = t
    if (!paused) {
      const run = queue; queue = []
      for (const [, cb] of run) { try { cb(t) } catch (e) { setTimeout(() => { throw e }) } }
      if (ghostOn && !real && document.body) ghost(t, dt)
    }
    const r = realNow(); if (r > syncAt) { syncAnimations(); syncAt = r + 150 }
    realRaf(frame)
  }
  realRaf(frame)
  const setPaused = v => { paused = v; syncAnimations() }
  let hovered = false
  addEventListener('message', e => { const c = e.data && e.data.creativeFx
    if (c === 'play') { hovered = true; setPaused(false) } else if (c === 'pause') { hovered = false; setPaused(true) } })
  // Thumbnails: show a meaningful still frame (scroll demos part-way down), then wait for hover
  if (hoverMode) setTimeout(() => {
    const max = document.documentElement.scrollHeight - innerHeight
    if (hovered) return
    if (max > 20 && !real) { y = max * .35; scrollTo(0, y) }
    setPaused(true)
  }, 1400)
})()</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotlight Border Cards</title>
<style>
  html { height: 100%; } body { margin: 0; min-height: 100%; }
  body { background: #050507; color: #e8e8ee; font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  h3 { margin: 0 0 6px; font-size: 16px; } p { margin: 0; font-size: 13px; opacity: .6; line-height: 1.5; }

  /* === EFFECT === */
  .spotlight-grid {
    --glow: 140 120 255; --size: 380px;
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; width: min(820px, 100%);
  }
  .spot-card {
    --x: -999px; --y: -999px;
    position: relative; border-radius: 18px; padding: 1px;
    background:
      radial-gradient(var(--size) circle at var(--x) var(--y), rgb(var(--glow) / .9), transparent 40%),
      rgb(255 255 255 / .08);
  }
  .spot-inner {
    position: relative; height: 100%; min-height: 150px; border-radius: 17px; padding: 22px; box-sizing: border-box;
    background: #0c0c11; overflow: hidden;
  }
  .spot-inner::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(calc(var(--size) * 1.4) circle at var(--x) var(--y), rgb(var(--glow) / .12), transparent 40%);
  }
</style>
</head>
<body>
  <div class="spotlight-grid">
    <div class="spot-card"><div class="spot-inner"><h3>Realtime sync</h3><p>Every change, everywhere, instantly.</p></div></div>
    <div class="spot-card"><div class="spot-inner"><h3>Keyboard first</h3><p>Do everything without the mouse.</p></div></div>
    <div class="spot-card"><div class="spot-inner"><h3>Offline ready</h3><p>Keep working on a plane.</p></div></div>
    <div class="spot-card"><div class="spot-inner"><h3>Integrations</h3><p>Plug into the tools you love.</p></div></div>
    <div class="spot-card"><div class="spot-inner"><h3>Insights</h3><p>Know what moves the needle.</p></div></div>
    <div class="spot-card"><div class="spot-inner"><h3>Secure</h3><p>SOC 2, SSO and audit logs.</p></div></div>
  </div>
<script>
  document.querySelectorAll('.spotlight-grid').forEach(grid => {
    const cards = [...grid.querySelectorAll('.spot-card')];
    grid.addEventListener('pointermove', e => cards.forEach(c => {
      const r = c.getBoundingClientRect();
      c.style.setProperty('--x', `${e.clientX - r.left}px`);
      c.style.setProperty('--y', `${e.clientY - r.top}px`);
    }));
    grid.addEventListener('pointerleave', () => cards.forEach(c => { c.style.setProperty('--x', '-999px'); c.style.setProperty('--y', '-999px'); }));
  });
</script>
</body>
</html>
