<!--
@name Sticky Stacking Cards
@category Scroll
@tags sticky, stack, cards, depth, scale, features section
@deps none
@support Evergreen browsers
@description Full-width cards pin one after another and pile up like a deck; each covered card scales down and dims, giving a satisfying sense of depth.
@usage Wrap cards in .stack and give each .stack-card a --i index. Top offset and scale step are CSS/JS variables (OFFSET, SCALE_STEP).
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sticky Stacking Cards</title>
<style>
  body { margin: 0; background: #f3f1ec; color: #111; font-family: system-ui, sans-serif; }
  .intro { height: 50vh; display: grid; place-items: center; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; opacity: .5; }

  /* === EFFECT === */
  .stack { max-width: 760px; margin: 0 auto 60vh; padding: 0 20px; }
  .stack-card {
    position: sticky; top: calc(8vh + var(--i) * 22px);
    height: 62vh; margin-bottom: 8vh; border-radius: 28px; padding: 36px;
    box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;
    transform-origin: 50% 0; will-change: transform;
    box-shadow: 0 -10px 40px rgba(0,0,0,.08);
  }
  .stack-card h2 { margin: 0; font-size: clamp(28px, 5vw, 52px); letter-spacing: -.03em; line-height: 1; }
  .stack-card span { font: 500 13px/1 ui-monospace, monospace; opacity: .6; }
</style>
</head>
<body>
  <div class="intro">Scroll ↓</div>
  <section class="stack">
    <article class="stack-card" style="--i:0;background:#1d1d22;color:#fff"><span>01 — Discover</span><h2>Research that finds the real problem.</h2></article>
    <article class="stack-card" style="--i:1;background:#c8f560"><span>02 — Design</span><h2>Systems, not screens.</h2></article>
    <article class="stack-card" style="--i:2;background:#ff8a5c"><span>03 — Build</span><h2>Production-grade from day one.</h2></article>
    <article class="stack-card" style="--i:3;background:#8fb8ff"><span>04 — Grow</span><h2>Measure, learn, iterate.</h2></article>
  </section>
<script>
  const SCALE_STEP = 0.06;
  const cards = [...document.querySelectorAll('.stack-card')];
  const update = () => cards.forEach((card, i) => {
    const next = cards[i + 1]; if (!next) return;
    const a = card.getBoundingClientRect(), b = next.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, 1 - (b.top - a.top) / a.height)); // how much next covers this one
    card.style.transform = `scale(${1 - p * SCALE_STEP})`;
    card.style.filter = `brightness(${1 - p * .25})`;
  });
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    addEventListener('scroll', () => requestAnimationFrame(update), { passive: true }); update();
  }
</script>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
