<!--
@name Liquid Glass
@category Material & Transition
@tags glassmorphism, liquid glass, refraction, svg displacement, backdrop-filter, apple 2025, draggable
@deps none
@support Refraction in Chromium (SVG filter in backdrop-filter); Safari/Firefox get frosted-glass fallback
@description A draggable glass lens that refracts and warps the content beneath it, with specular rim highlights — the Apple "Liquid Glass" material for the web. Degrades to classic frosted glassmorphism.
@usage Put the <svg> filter once in the page, then add class .liquid-glass to any element. Strength = scale on feDisplacementMap; frost = blur().
@source Apple Liquid Glass (WWDC 2025), web technique popularised on CodePen
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  const q = new URLSearchParams(location.search); if (!q.has('preview')) return
  document.documentElement.classList.add('fx-preview')
  const RATE = 0.5, hoverMode = q.get('preview') === 'hover'
  const realNow = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window)
  let virt = 0, last = realNow(), paused = false, queue = [], ids = 0
  const now = () => { const n = realNow(); if (!paused) virt += (n - last) * RATE; last = n; return virt }
  performance.now = now
  window.requestAnimationFrame = cb => { queue.push([++ids, cb]); return ids }
  window.cancelAnimationFrame = id => { queue = queue.filter(e => e[0] !== id) }
  const slowed = new WeakSet(), heldByUs = new Set()
  const syncAnimations = () => { if (!document.getAnimations) return
    for (const a of document.getAnimations()) {
      if (!slowed.has(a)) { a.playbackRate *= RATE; slowed.add(a) }
      if (paused && a.playState === 'running') { a.pause(); heldByUs.add(a) }
    }
    if (!paused) { for (const a of heldByUs) if (a.playState === 'paused') a.play(); heldByUs.clear() }
  }
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, last2 = null, prev = 0, syncAt = 0
  function ghost(t, dt) {
    const max = document.documentElement.scrollHeight - innerHeight
    if (max > 20) { y += dir * max * dt / 16000; if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
    const s = t / 1000, x = innerWidth * (.5 + .3 * Math.sin(s * 1.1)), py = innerHeight * (.5 + .26 * Math.sin(s * 1.7)), o = { bubbles: true, clientX: x, clientY: py }
    const el = document.elementFromPoint(x, py)
    if (el !== last2) {
      const a = chain(last2), b = chain(el)
      a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
      if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
      b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
      last2 = el
    }
    ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
  }
  let ghostOn = false; setTimeout(() => { ghostOn = true }, 500)
  function frame() {
    const t = now(), dt = t - prev; prev = t
    if (!paused) {
      const run = queue; queue = []
      for (const [, cb] of run) { try { cb(t) } catch (e) { setTimeout(() => { throw e }) } }
      if (ghostOn && !real && document.body) ghost(t, dt)
    }
    const r = realNow(); if (r > syncAt) { syncAnimations(); syncAt = r + 150 }
    realRaf(frame)
  }
  realRaf(frame)
  const setPaused = v => { paused = v; syncAnimations() }
  let hovered = false
  addEventListener('message', e => { const c = e.data && e.data.creativeFx
    if (c === 'play') { hovered = true; setPaused(false) } else if (c === 'pause') { hovered = false; setPaused(true) } })
  // Thumbnails: show a meaningful still frame (scroll demos part-way down), then wait for hover
  if (hoverMode) setTimeout(() => {
    const max = document.documentElement.scrollHeight - innerHeight
    if (hovered) return
    if (max > 20 && !real) { y = max * .35; scrollTo(0, y) }
    setPaused(true)
  }, 1400)
})()</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Glass</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: system-ui, sans-serif; color: #111;
    background:
      repeating-linear-gradient(45deg, rgb(255 255 255 / .18) 0 2px, transparent 2px 22px),
      radial-gradient(circle at 25% 30%, #ff7a59, transparent 40%), radial-gradient(circle at 75% 65%, #4f7cff, transparent 45%),
      radial-gradient(circle at 60% 20%, #ffd84f, transparent 35%), #f2efe9;
  }
  .bg-text { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; font-size: clamp(48px, 12vw, 140px); font-weight: 900; letter-spacing: -.06em; line-height: .85; user-select: none; }

  /* === EFFECT === */
  .liquid-glass {
    position: absolute; left: calc(50% - 130px); top: calc(50% - 60px); width: 260px; height: 120px; border-radius: 999px;
    display: grid; place-items: center; color: #fff; font-weight: 650; letter-spacing: .02em; text-shadow: 0 1px 10px rgba(0,0,0,.45);
    background: linear-gradient(135deg, rgb(255 255 255 / .22), rgb(255 255 255 / .04) 60%);
    outline: 1px solid rgb(255 255 255 / .55); outline-offset: -1px;
    -webkit-backdrop-filter: blur(14px) saturate(1.7);
    backdrop-filter: blur(14px) saturate(1.7);            /* fallback (Safari/Firefox) */
    backdrop-filter: blur(1.5px) url(#liquid-glass) saturate(1.6) brightness(1.08); /* Chromium refraction */
    box-shadow:
      inset 2px 2px 1px rgb(255 255 255 / .9), inset -2px -2px 2px rgb(255 255 255 / .45),
      inset 0 0 28px rgb(255 255 255 / .35), 0 18px 40px rgb(0 0 0 / .28), 0 2px 6px rgb(0 0 0 / .12);
    cursor: grab; touch-action: none; user-select: none;
  }
  .liquid-glass:active { cursor: grabbing; }
</style>
</head>
<body>
  <div class="bg-text" aria-hidden="true">LIQUID<br>GLASS</div>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="liquid-glass" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.012" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="70" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <div class="liquid-glass">Drag me</div>
<script>
  const g = document.querySelector('.liquid-glass');
  let ox = 0, oy = 0;
  g.addEventListener('pointerdown', e => { g.setPointerCapture(e.pointerId); ox = e.clientX - g.offsetLeft; oy = e.clientY - g.offsetTop; });
  g.addEventListener('pointermove', e => {
    if (!g.hasPointerCapture(e.pointerId)) return;
    g.style.left = `${e.clientX - ox}px`; g.style.top = `${e.clientY - oy}px`;
  });
</script>
</body>
</html>
