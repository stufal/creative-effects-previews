<!--
@name Pinned Horizontal Scroll
@category Scroll
@tags sticky, horizontal, gallery, pin, scrub, portfolio
@deps none
@support Evergreen browsers
@description Vertical scrolling is converted into a horizontal slide: the section pins to the viewport while a row of panels glides sideways, then releases. A portfolio/agency classic, without GSAP.
@usage Structure: .h-scroll > .h-sticky > .h-track > panels. Section height is set automatically from the track width so the pace feels 1:1.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinned Horizontal Scroll</title>
<style>
  body { margin: 0; background: #0e0e12; color: #fff; font-family: system-ui, sans-serif; }
  .pad { height: 60vh; display: grid; place-items: center; opacity: .45; font-size: 13px; letter-spacing: .2em; text-transform: uppercase; }

  /* === EFFECT === */
  .h-scroll { position: relative; }
  .h-sticky { position: sticky; top: 0; height: 100vh; overflow: hidden; display: flex; align-items: center; }
  .h-track { display: flex; gap: 4vw; padding: 0 8vw; will-change: transform; }
  .panel {
    flex: 0 0 min(70vw, 520px); height: 62vh; border-radius: 24px; padding: 28px; box-sizing: border-box;
    display: flex; align-items: flex-end; font-size: clamp(24px, 4vw, 44px); font-weight: 700; letter-spacing: -.03em;
    background: linear-gradient(160deg, hsl(var(--h) 80% 60%), hsl(calc(var(--h) + 40) 70% 30%));
  }
  @media (prefers-reduced-motion: reduce) { .h-sticky { position: static; height: auto; overflow-x: auto; padding: 40px 0; } }
</style>
</head>
<body>
  <div class="pad">Scroll ↓</div>
  <section class="h-scroll">
    <div class="h-sticky">
      <div class="h-track">
        <div class="panel" style="--h:260">Brand</div>
        <div class="panel" style="--h:300">Product</div>
        <div class="panel" style="--h:340">Motion</div>
        <div class="panel" style="--h:20">Web</div>
        <div class="panel" style="--h:160">3D</div>
      </div>
    </div>
  </section>
  <div class="pad">The end</div>
<script>
  const section = document.querySelector('.h-scroll'), track = section.querySelector('.h-track');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let dist = 0;
  const layout = () => {
    dist = Math.max(0, track.scrollWidth - innerWidth);
    section.style.height = reduce ? 'auto' : `${innerHeight + dist}px`;
    update();
  };
  const update = () => {
    if (reduce) return;
    const p = Math.min(1, Math.max(0, -section.getBoundingClientRect().top / dist || 0));
    track.style.transform = `translate3d(${-p * dist}px,0,0)`;
  };
  addEventListener('scroll', update, { passive: true }); addEventListener('resize', layout); layout();
</script>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
