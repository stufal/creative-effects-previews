<!--
@name Voice Glow
@category AI Interface
@tags ai, voice, microphone, audio reactive, web audio, glow, chat input, siri-style
@deps none (Web Audio API)
@support Evergreen browsers; mic needs HTTPS/localhost + permission, otherwise a simulated voice is used
@description A colourful aurora rises from the bottom of a chat input as you speak, its height and brightness following your voice level, then it sweeps side to side while the AI "thinks" about the reply.
@usage Wrap the input in .voice-wrap and add a .voice-glow sibling with 4 spans. Drive it with voice.setLevel(0–1) and voice.setState('idle' | 'listening' | 'thinking'), or call voice.useMic() to bind the real microphone.
@source Concept from libraries.dev "Voice", recreated from scratch
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  const q = new URLSearchParams(location.search); if (!q.has('preview')) return
  document.documentElement.classList.add('fx-preview')
  const RATE = 1, hoverMode = q.get('preview') === 'hover'
  const realNow = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window)
  let virt = 0, last = realNow(), paused = false, queue = [], ids = 0
  const now = () => { const n = realNow(); if (!paused) virt += (n - last) * RATE; last = n; return virt }
  performance.now = now
  window.requestAnimationFrame = cb => { queue.push([++ids, cb]); return ids }
  window.cancelAnimationFrame = id => { queue = queue.filter(e => e[0] !== id) }
  const slowed = new WeakSet(), heldByUs = new Set()
  const syncAnimations = () => { if (!document.getAnimations) return
    for (const a of document.getAnimations()) {
      if (!slowed.has(a)) { a.playbackRate *= RATE; slowed.add(a) }
      if (paused && a.playState === 'running') { a.pause(); heldByUs.add(a) }
    }
    if (!paused) { for (const a of heldByUs) if (a.playState === 'paused') a.play(); heldByUs.clear() }
  }
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, last2 = null, prev = 0, syncAt = 0
  function ghost(t, dt) {
    const max = document.documentElement.scrollHeight - innerHeight
    if (max > 20) { y += dir * max * dt / 8000; if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
    const s = t / 1000, x = innerWidth * (.5 + .3 * Math.sin(s * 1.1)), py = innerHeight * (.5 + .26 * Math.sin(s * 1.7)), o = { bubbles: true, clientX: x, clientY: py }
    const el = document.elementFromPoint(x, py)
    if (el !== last2) {
      const a = chain(last2), b = chain(el)
      a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
      if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
      b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
      last2 = el
    }
    ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
  }
  let ghostOn = false; setTimeout(() => { ghostOn = true }, 500)
  function frame() {
    const t = now(), dt = t - prev; prev = t
    if (!paused) {
      const run = queue; queue = []
      for (const [, cb] of run) { try { cb(t) } catch (e) { setTimeout(() => { throw e }) } }
      if (ghostOn && !real && document.body) ghost(t, dt)
    }
    const r = realNow(); if (r > syncAt) { syncAnimations(); syncAt = r + 150 }
    realRaf(frame)
  }
  realRaf(frame)
  const setPaused = v => { paused = v; syncAnimations() }
  let hovered = false
  addEventListener('message', e => { const c = e.data && e.data.creativeFx
    if (c === 'play') { hovered = true; setPaused(false) } else if (c === 'pause') { hovered = false; setPaused(true) } })
  // Thumbnails: show a meaningful still frame (scroll demos part-way down), then wait for hover
  if (hoverMode) setTimeout(() => {
    const max = document.documentElement.scrollHeight - innerHeight
    if (hovered) return
    if (max > 20 && !real) { y = max * .35; scrollTo(0, y) }
    setPaused(true)
  }, 1400)
})()</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voice Glow</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #09090c; color: #ececf2; font-family: system-ui, sans-serif; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
  .phone { position: relative; width: min(380px, 100%); height: min(560px, 92vh); border-radius: 34px; background: #111116; border: 1px solid rgb(255 255 255 / .07); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  .transcript { flex: 1; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 20px; font-weight: 500; letter-spacing: -.01em; }
  .transcript .dim { opacity: .35; }
  .bar { position: relative; z-index: 2; margin: 14px; display: flex; gap: 8px; align-items: center; padding: 10px 10px 10px 16px; border-radius: 20px; background: rgb(20 20 26 / .72); backdrop-filter: blur(10px); border: 1px solid rgb(255 255 255 / .08); font-size: 13px; }
  .bar span { flex: 1; opacity: .55; }
  .bar button { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .1); color: #fff; cursor: pointer; font-size: 14px; }
  .bar button.on { background: #fff; color: #000; }

  /* === EFFECT === */
  .voice-glow { --level: 0; --sweep: 0; position: absolute; inset: auto -20% 0 -20%; height: 75%; pointer-events: none; z-index: 1; filter: blur(34px) saturate(1.4); }
  .voice-glow span {
    position: absolute; bottom: -30%; width: 46%; aspect-ratio: 1 / 1.3; border-radius: 50%; mix-blend-mode: screen;
    transform: translateX(calc(var(--sweep) * 1%)) scaleY(calc(.25 + var(--level) * 1.1)); transform-origin: 50% 100%;
    opacity: calc(.15 + var(--level) * .85); transition: transform .12s linear, opacity .2s;
  }
  .voice-glow span:nth-child(1) { left: 8%;  background: #ff4d8d; }
  .voice-glow span:nth-child(2) { left: 28%; background: #7c5cff; }
  .voice-glow span:nth-child(3) { left: 46%; background: #22d3ee; }
  .voice-glow span:nth-child(4) { left: 64%; background: #fbbf24; width: 36%; }
</style>
</head>
<body>
  <div class="phone">
    <div class="transcript" aria-live="polite"><div>Set a timer for <span class="dim">ten minutes</span></div></div>
    <div class="voice-glow" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="bar"><span id="status">Agent (auto) · simulated voice</span>
      <button id="mic" aria-label="Use microphone" title="Use real microphone">🎙</button>
      <button id="stop" aria-label="Stop">✕</button>
    </div>
  </div>
<script>
  class VoiceGlow {
    constructor(el) { this.el = el; this.level = 0; this.target = 0; this.state = 'idle'; this.t0 = performance.now(); requestAnimationFrame(this.tick); }
    setLevel(v) { this.target = Math.max(0, Math.min(1, v)); }
    setState(s) { this.state = s; }
    async useMic() {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const ac = new AudioContext(), an = ac.createAnalyser(); an.fftSize = 512;
      ac.createMediaStreamSource(stream).connect(an);
      const buf = new Uint8Array(an.fftSize);
      this.micStop = () => { stream.getTracks().forEach(t => t.stop()); ac.close(); this.readMic = null; };
      this.readMic = () => { an.getByteTimeDomainData(buf); let s = 0; for (const v of buf) s += ((v - 128) / 128) ** 2; return Math.min(1, Math.sqrt(s / buf.length) * 5); };
      this.state = 'listening';
    }
    tick = now => {
      const t = (now - this.t0) / 1000;
      if (this.readMic && this.state === 'listening') this.target = this.readMic();
      const goal = this.state === 'idle' ? 0 : this.state === 'thinking' ? .45 : this.target;
      this.level += (goal - this.level) * (goal > this.level ? .35 : .08);   // fast attack, slow release
      const sweep = this.state === 'thinking' ? Math.sin(t * 2.4) * 28 : 0;
      this.el.style.setProperty('--level', this.level.toFixed(3));
      this.el.style.setProperty('--sweep', sweep.toFixed(2));
      requestAnimationFrame(this.tick);
    };
  }

  const voice = new VoiceGlow(document.querySelector('.voice-glow'));
  const status = document.getElementById('status'), micBtn = document.getElementById('mic');
  // Simulated conversation loop (used until the real mic is enabled)
  let sim = true, phase = 0;
  const phases = [['listening', 4200, 'Listening…'], ['thinking', 2600, 'Thinking…'], ['idle', 1600, 'Agent (auto) · simulated voice']];
  (function cycle() {
    if (!sim) return;
    const [state, ms, label] = phases[phase++ % phases.length];
    voice.setState(state); status.textContent = label; setTimeout(cycle, ms);
  })();
  setInterval(() => { if (sim) { const t = performance.now() / 1000; voice.setLevel(.25 + .5 * Math.abs(Math.sin(t * 3.1) * Math.sin(t * 7.3)) + Math.random() * .2); } }, 70);

  micBtn.onclick = async () => {
    try { sim = false; await voice.useMic(); micBtn.classList.add('on'); status.textContent = 'Listening (mic)…'; }
    catch { sim = true; status.textContent = 'Mic unavailable · simulated voice'; }
  };
  document.getElementById('stop').onclick = () => { voice.micStop?.(); micBtn.classList.remove('on'); sim = false; voice.setState('idle'); status.textContent = 'Stopped'; };
</script>
</body>
</html>
