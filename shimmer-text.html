<!--
@name Shimmer & Gradient Text
@category Text
@tags gradient text, shimmer, shine, background-clip, ai product, badge
@deps none
@support Evergreen browsers
@description Two looks in one: a slow-flowing multicolour gradient headline, and a subtle light sweep that glints across muted text — the "AI is thinking" / premium badge shimmer.
@usage .text-gradient for flowing colour; .text-shimmer for the light sweep. Colours and speed are CSS variables.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shimmer & Gradient Text</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #08080c; font-family: system-ui, sans-serif; display: grid; place-content: center; gap: 22px; text-align: center; padding: 20px; }
  h1 { margin: 0; font-size: clamp(40px, 9vw, 96px); letter-spacing: -.045em; font-weight: 800; line-height: 1; }
  .pill { justify-self: center; padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); font-size: 15px; }

  /* === EFFECT === */
  .text-gradient {
    background: linear-gradient(90deg, #7c5cff, #ff5ca8, #ffb85c, #5cf0ff, #7c5cff) 0 0 / 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: text-flow 8s linear infinite;
  }
  @keyframes text-flow { to { background-position: 300% 0; } }

  .text-shimmer {
    --base: #6b6b78; --shine: #ffffff;
    background: linear-gradient(110deg, var(--base) 35%, var(--shine) 50%, var(--base) 65%) 0 0 / 250% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: text-shine 2.4s cubic-bezier(.6,0,.4,1) infinite;
  }
  @keyframes text-shine { from { background-position: 100% 0; } to { background-position: -150% 0; } }

  @media (prefers-reduced-motion: reduce) { .text-gradient, .text-shimmer { animation: none; } }
</style>
</head>
<body>
  <h1 class="text-gradient">Imagine more.</h1>
  <div class="pill"><span class="text-shimmer">✦ Thinking about your request…</span></div>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
