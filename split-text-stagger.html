<!--
@name Split Text Stagger Reveal
@category Text
@tags split text, letters, mask, stagger, hero title, intro animation
@deps none
@support Evergreen browsers
@description Headline letters rise out of an invisible mask one after another with a springy ease, line by line — the hero intro of countless award sites, without GSAP SplitText.
@usage Add data-split to a heading. Use data-split="words" to animate words instead of letters. Set --stagger on the element. Call replay(el) to re-run.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  const q = new URLSearchParams(location.search); if (!q.has('preview')) return
  document.documentElement.classList.add('fx-preview')
  const RATE = 1, hoverMode = q.get('preview') === 'hover'
  const realNow = performance.now.bind(performance), realRaf = window.requestAnimationFrame.bind(window)
  let virt = 0, last = realNow(), paused = false, queue = [], ids = 0
  const now = () => { const n = realNow(); if (!paused) virt += (n - last) * RATE; last = n; return virt }
  performance.now = now
  window.requestAnimationFrame = cb => { queue.push([++ids, cb]); return ids }
  window.cancelAnimationFrame = id => { queue = queue.filter(e => e[0] !== id) }
  const slowed = new WeakSet(), heldByUs = new Set()
  const syncAnimations = () => { if (!document.getAnimations) return
    for (const a of document.getAnimations()) {
      if (!slowed.has(a)) { a.playbackRate *= RATE; slowed.add(a) }
      if (paused && a.playState === 'running') { a.pause(); heldByUs.add(a) }
    }
    if (!paused) { for (const a of heldByUs) if (a.playState === 'paused') a.play(); heldByUs.clear() }
  }
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, last2 = null, prev = 0, syncAt = 0
  function ghost(t, dt) {
    const max = document.documentElement.scrollHeight - innerHeight
    if (max > 20) { y += dir * max * dt / 8000; if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
    const s = t / 1000, x = innerWidth * (.5 + .3 * Math.sin(s * 1.1)), py = innerHeight * (.5 + .26 * Math.sin(s * 1.7)), o = { bubbles: true, clientX: x, clientY: py }
    const el = document.elementFromPoint(x, py)
    if (el !== last2) {
      const a = chain(last2), b = chain(el)
      a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
      if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
      b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
      last2 = el
    }
    ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
  }
  let ghostOn = false; setTimeout(() => { ghostOn = true }, 500)
  function frame() {
    const t = now(), dt = t - prev; prev = t
    if (!paused) {
      const run = queue; queue = []
      for (const [, cb] of run) { try { cb(t) } catch (e) { setTimeout(() => { throw e }) } }
      if (ghostOn && !real && document.body) ghost(t, dt)
    }
    const r = realNow(); if (r > syncAt) { syncAnimations(); syncAt = r + 150 }
    realRaf(frame)
  }
  realRaf(frame)
  const setPaused = v => { paused = v; syncAnimations() }
  let hovered = false
  addEventListener('message', e => { const c = e.data && e.data.creativeFx
    if (c === 'play') { hovered = true; setPaused(false) } else if (c === 'pause') { hovered = false; setPaused(true) } })
  // Thumbnails: show a meaningful still frame (scroll demos part-way down), then wait for hover
  if (hoverMode) setTimeout(() => {
    const max = document.documentElement.scrollHeight - innerHeight
    if (hovered) return
    if (max > 20 && !real) { y = max * .35; scrollTo(0, y) }
    setPaused(true)
  }, 1400)
})()</script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Split Text Stagger Reveal</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #ece8df; color: #121212; font-family: system-ui, sans-serif; display: grid; place-content: center; gap: 24px; padding: 20px; }
  h1 { margin: 0; font-size: clamp(44px, 11vw, 130px); line-height: .95; letter-spacing: -.055em; font-weight: 800; }
  p { margin: 0; font-size: 18px; max-width: 420px; opacity: .7; }
  button { justify-self: start; font: 600 13px system-ui; padding: 10px 18px; border-radius: 999px; border: 1px solid #121212; background: none; cursor: pointer; }

  /* === EFFECT === */
  [data-split] { --stagger: 28ms; }
  .split-mask { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: .08em; margin-bottom: -.08em; }
  .split-unit {
    display: inline-block; transform: translateY(110%) rotate(6deg); transform-origin: 0 100%;
    animation: split-rise .9s cubic-bezier(.2, .9, .25, 1.05) forwards;
    animation-delay: calc(var(--i) * var(--stagger));
  }
  @keyframes split-rise { to { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .split-unit { animation: none; transform: none; } }
</style>
</head>
<body>
  <h1 data-split>Make it<br>move.</h1>
  <p data-split="words" style="--stagger:40ms">Every letter enters on its own beat, masked so it appears to rise from a hidden baseline.</p>
  <button onclick="document.querySelectorAll('[data-split]').forEach(replay)">Replay</button>
<script>
  function split(el) {
    const mode = el.dataset.split === 'words' ? 'words' : 'chars';
    el.setAttribute('aria-label', el.innerText.replace(/\n/g, ' '));
    let i = 0;
    const lines = el.innerHTML.split(/<br\s*\/?>/i);
    el.innerHTML = lines.map(line => {
      const words = line.trim().split(/\s+/);
      return words.map(w => {
        const units = mode === 'words' ? [w] : [...w];
        return `<span class="split-mask" aria-hidden="true">${units.map(u => `<span class="split-unit" style="--i:${i++}">${u}</span>`).join('')}</span>`;
      }).join(' ');
    }).join('<br>');
  }
  function replay(el) {
    el.querySelectorAll('.split-unit').forEach(u => { u.style.animation = 'none'; u.offsetWidth; u.style.animation = ''; });
  }
  document.querySelectorAll('[data-split]').forEach(split);
</script>
</body>
</html>
