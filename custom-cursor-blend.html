<!--
@name Blend-Mode Cursor Follower
@category Cursor & Hover
@tags cursor, mix-blend-mode, difference, lerp, agency
@deps none
@support Evergreen browsers; auto-disabled on touch devices
@description A soft circle trails the pointer with inertia and inverts whatever it passes over (mix-blend-mode: difference). It swells over links and buttons and shrinks on press.
@usage Include .cursor + script. Any element with data-cursor="grow" (or a / button) enlarges it. Change EASE for more/less lag.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Blend-Mode Cursor Follower</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #f4f1ea; color: #111; font-family: system-ui, sans-serif; display: grid; place-content: center; gap: 24px; text-align: center; }
  h1 { font-size: clamp(40px, 10vw, 110px); margin: 0; letter-spacing: -.05em; line-height: .9; }
  nav { display: flex; gap: 28px; justify-content: center; }
  nav a { color: inherit; font-weight: 600; text-decoration: none; }

  /* === EFFECT === */
  @media (hover: hover) and (pointer: fine) {
    body { cursor: none; }
    a, button { cursor: none; }
    .cursor {
      position: fixed; left: 0; top: 0; width: 28px; height: 28px; margin: -14px 0 0 -14px;
      border-radius: 50%; background: #fff; mix-blend-mode: difference; pointer-events: none; z-index: 9999;
      transition: width .3s cubic-bezier(.2,.8,.2,1), height .3s cubic-bezier(.2,.8,.2,1), margin .3s cubic-bezier(.2,.8,.2,1);
    }
    .cursor.is-grow { width: 90px; height: 90px; margin: -45px 0 0 -45px; }
    .cursor.is-down { width: 18px; height: 18px; margin: -9px 0 0 -9px; }
  }
  @media not ((hover: hover) and (pointer: fine)) { .cursor { display: none; } }
</style>
</head>
<body>
  <div class="cursor" aria-hidden="true"></div>
  <h1 data-cursor="grow">Creative<br>Studio</h1>
  <nav><a href="#">Work</a><a href="#">About</a><a href="#">Contact</a></nav>
<script>
  const EASE = 0.18;
  const c = document.querySelector('.cursor');
  if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
    let x = innerWidth / 2, y = innerHeight / 2, tx = x, ty = y;
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    addEventListener('pointermove', e => { tx = e.clientX; ty = e.clientY; });
    addEventListener('pointerdown', () => c.classList.add('is-down'));
    addEventListener('pointerup', () => c.classList.remove('is-down'));
    document.addEventListener('pointerover', e => c.classList.toggle('is-grow', !!e.target.closest('a,button,[data-cursor="grow"]')));
    (function loop() {
      x += (tx - x) * (reduce ? 1 : EASE); y += (ty - y) * (reduce ? 1 : EASE);
      c.style.transform = `translate3d(${x}px,${y}px,0)`;
      requestAnimationFrame(loop);
    })();
  }
</script>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
