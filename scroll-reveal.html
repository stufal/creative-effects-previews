<!--
@name Scroll-Driven Reveal
@category Scroll
@tags css, animation-timeline, view(), fade, blur, no-js
@deps none
@support Native in Chrome/Edge 115+ & Safari 26+; IntersectionObserver fallback included
@description Elements lift, scale and un-blur as they enter the viewport, driven purely by scroll position with CSS animation-timeline: view(). Scrubs forwards and backwards with the scrollbar.
@usage Add class "reveal" to any element. Tweak animation-range (entry 0% → cover 35%) to change when the animation starts and ends.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll-Driven Reveal</title>
<style>
  body { margin: 0; background: #0b0b10; color: #f2f2f5; font-family: system-ui, sans-serif; }
  .hint { height: 70vh; display: grid; place-items: center; font-size: 14px; letter-spacing: .2em; text-transform: uppercase; opacity: .5; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 24px; max-width: 900px; margin: 0 auto 40vh; }
  .card { aspect-ratio: 1; border-radius: 20px; background: linear-gradient(135deg, hsl(var(--h) 90% 65%), hsl(calc(var(--h) + 50) 90% 55%)); }

  /* === EFFECT === */
  .reveal {
    animation: reveal linear both;
    animation-timeline: view();
    animation-range: entry 0% cover 35%;
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(80px) scale(.92); filter: blur(10px); }
    to   { opacity: 1; transform: none; filter: none; }
  }
  /* Fallback for browsers without scroll-driven animations */
  @supports not (animation-timeline: view()) {
    .reveal { animation: none; opacity: 0; transform: translateY(80px) scale(.92); transition: opacity .9s, transform .9s cubic-bezier(.2,.7,.2,1); }
    .reveal.is-in { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; }
  }
</style>
</head>
<body>
  <div class="hint">Scroll ↓</div>
  <div class="grid">
    <div class="card reveal" style="--h:250"></div><div class="card reveal" style="--h:280"></div>
    <div class="card reveal" style="--h:310"></div><div class="card reveal" style="--h:340"></div>
    <div class="card reveal" style="--h:10"></div><div class="card reveal" style="--h:30"></div>
    <div class="card reveal" style="--h:180"></div><div class="card reveal" style="--h:200"></div>
    <div class="card reveal" style="--h:220"></div>
  </div>
<script>
  if (!CSS.supports('animation-timeline', 'view()')) {
    const io = new IntersectionObserver(entries => entries.forEach(e => {
      if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); }
    }), { threshold: .15 });
    document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  }
</script>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
