<!--
@name 3D Tilt Card with Glare
@category Cursor & Hover
@tags 3d, perspective, tilt, glare, holographic, card, parallax layers
@deps none
@support Evergreen browsers
@description A card rotates in 3D toward the pointer, inner layers float at different depths, and a glossy light glare slides across the surface — the premium "physical card" feel.
@usage Add data-tilt to a card. Children with data-depth="40" pop forward by that many px. MAX_TILT sets the angle.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Tilt Card with Glare</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: radial-gradient(circle at 50% 30%, #23233a, #0a0a10); display: grid; place-items: center; font-family: system-ui, sans-serif; perspective: 900px; }

  /* === EFFECT === */
  [data-tilt] {
    --rx: 0deg; --ry: 0deg; --gx: 50%; --gy: 50%; --go: 0;
    position: relative; width: 280px; height: 380px; border-radius: 22px; padding: 26px; box-sizing: border-box;
    background: linear-gradient(145deg, #6d5dfc, #c04bff 55%, #ff7ab6); color: #fff;
    transform: rotateX(var(--rx)) rotateY(var(--ry)); transform-style: preserve-3d;
    transition: transform .5s cubic-bezier(.2,.8,.2,1); box-shadow: 0 30px 60px -20px rgba(0,0,0,.6);
  }
  [data-tilt].is-hover { transition: transform .08s linear; }
  [data-tilt]::after { /* glare */
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: radial-gradient(circle at var(--gx) var(--gy), rgba(255,255,255,.55), transparent 45%);
    mix-blend-mode: overlay; opacity: var(--go); transition: opacity .3s;
  }
  [data-depth] { transform: translateZ(calc(var(--d) * 1px)); }
  .chip { width: 46px; height: 34px; border-radius: 6px; background: linear-gradient(135deg, #ffe29a, #c79a3a); }
  .title { position: absolute; left: 26px; bottom: 26px; font-size: 28px; font-weight: 750; letter-spacing: -.02em; }
  .num { position: absolute; left: 26px; bottom: 74px; font: 15px ui-monospace, monospace; opacity: .85; letter-spacing: .12em; }
</style>
</head>
<body>
  <div data-tilt>
    <div class="chip" data-depth style="--d:30"></div>
    <div class="num" data-depth style="--d:45">4242 0000 1717 2026</div>
    <div class="title" data-depth style="--d:60">Aurora Card</div>
  </div>
<script>
  const MAX_TILT = 14;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  document.querySelectorAll('[data-tilt]').forEach(card => {
    card.addEventListener('pointermove', e => {
      if (reduce) return;
      const r = card.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      card.classList.add('is-hover');
      card.style.setProperty('--ry', `${(px - .5) * 2 * MAX_TILT}deg`);
      card.style.setProperty('--rx', `${(.5 - py) * 2 * MAX_TILT}deg`);
      card.style.setProperty('--gx', `${px * 100}%`); card.style.setProperty('--gy', `${py * 100}%`);
      card.style.setProperty('--go', 1);
    });
    card.addEventListener('pointerleave', () => {
      card.classList.remove('is-hover');
      ['--rx', '--ry'].forEach(p => card.style.setProperty(p, '0deg')); card.style.setProperty('--go', 0);
    });
  });
</script>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
