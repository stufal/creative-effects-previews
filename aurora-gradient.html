<!--
@name Aurora Mesh Gradient
@category Background
@tags gradient, mesh, blobs, blur, aurora, hero background, css only
@deps none
@support Evergreen browsers
@description Large blurred colour blobs drift slowly and blend into each other, producing a soft living mesh gradient behind a hero — pure CSS, cheap on GPU.
@usage Drop .aurora as the first child of a position:relative section. Change blob colours via --c1…--c4 and speed via --speed.
@source original
@added 2026-10-16
-->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aurora Mesh Gradient</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #07070c; color: #fff; font-family: system-ui, sans-serif; }
  .hero { position: relative; height: 100%; display: grid; place-content: center; text-align: center; overflow: hidden; isolation: isolate; }
  .hero h1 { margin: 0; font-size: clamp(40px, 9vw, 100px); letter-spacing: -.05em; line-height: .95; }
  .hero p { opacity: .7; }

  /* === EFFECT === */
  .aurora {
    --c1: #7c3aed; --c2: #ec4899; --c3: #06b6d4; --c4: #f59e0b; --speed: 18s;
    position: absolute; inset: -20%; z-index: -1; filter: blur(70px) saturate(1.3); opacity: .85;
  }
  .aurora span { position: absolute; width: 55%; aspect-ratio: 1; border-radius: 50%; mix-blend-mode: screen; animation: drift var(--speed) ease-in-out infinite alternate; }
  .aurora span:nth-child(1) { background: var(--c1); left: 5%;  top: 10%; }
  .aurora span:nth-child(2) { background: var(--c2); right: 5%; top: 20%; animation-delay: calc(var(--speed) / -3); animation-duration: calc(var(--speed) * 1.3); }
  .aurora span:nth-child(3) { background: var(--c3); left: 25%; bottom: 0;  animation-delay: calc(var(--speed) / -1.5); animation-duration: calc(var(--speed) * .9); }
  .aurora span:nth-child(4) { background: var(--c4); right: 25%; bottom: 10%; width: 35%; opacity: .7; animation-duration: calc(var(--speed) * 1.6); }
  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1) rotate(0); }
    50%  { transform: translate(15%, -10%) scale(1.15) rotate(40deg); }
    100% { transform: translate(-10%, 12%) scale(.9) rotate(-20deg); }
  }
  @media (prefers-reduced-motion: reduce) { .aurora span { animation: none; } }
</style>
</head>
<body>
  <section class="hero">
    <div class="aurora" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <h1>Northern<br>lights</h1>
    <p>A living gradient in 20 lines of CSS.</p>
  </section>
<style>html.fx-preview{scrollbar-width:none}html.fx-preview::-webkit-scrollbar{display:none}</style>
<script>(() => {
  if (!new URLSearchParams(location.search).has('preview')) return
  document.documentElement.classList.add('fx-preview')
  let real = false; const stop = e => { if (e.isTrusted) real = true }
  addEventListener('pointermove', stop, true); addEventListener('wheel', stop, true); addEventListener('touchstart', stop, true)
  const chain = n => { const a = []; for (; n; n = n.parentElement) a.push(n); return a }
  let y = 0, dir = 1, t = 0, last = null
  function tick() {
    t += 1 / 60
    if (!real) {
      const max = document.documentElement.scrollHeight - innerHeight
      if (max > 20) { y += dir * Math.max(1, max / 420); if (y >= max) { y = max; dir = -1 } if (y <= 0) { y = 0; dir = 1 } scrollTo(0, y) }
      const x = innerWidth * (.5 + .32 * Math.sin(t * 1.3)), py = innerHeight * (.5 + .28 * Math.sin(t * 2.1)), o = { bubbles: true, clientX: x, clientY: py }
      const el = document.elementFromPoint(x, py)
      if (el !== last) {
        const a = chain(last), b = chain(el)
        a.filter(n => !b.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerleave', { clientX: x, clientY: py })))
        if (el) el.dispatchEvent(new PointerEvent('pointerover', o))
        b.filter(n => !a.includes(n)).forEach(n => n.dispatchEvent(new PointerEvent('pointerenter', { clientX: x, clientY: py })))
        last = el
      }
      ;(el || document).dispatchEvent(new PointerEvent('pointermove', o))
    }
    requestAnimationFrame(tick)
  }
  setTimeout(tick, 400)
})()</script>
</body>
</html>
